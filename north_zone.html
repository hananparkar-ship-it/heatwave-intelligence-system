<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=hotspot_map.html">
    <title>Climate Profiles | Heatwave Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <!-- Page styles: kept here so shared CSS stays short and readable. -->
    <style>
        @media (max-width:780px) {
            body>header {
                padding: 22px 18px;
            }

            nav ul {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 6px 18px;
            }

            .page-shell {
                margin: 24px auto 38px;
                padding: 0 18px;
            }

            form {
                margin: 20px 0;
                padding: 18px;
            }

            th, td {
                padding: 10px 9px;
                font-size: .92rem;
            }
        }

        @media (max-width:480px) {
            body {
                font-size: 15px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        .page-shell div[style] {
            background: #fff !important;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px 24px;
            margin: 16px 0 !important;
            box-shadow: var(--shadow);
        }

        .page-shell div[style] h2 {
            margin-top: 0;
        }

        iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
        }

        .page-intro {
            max-width: 780px;
            font-size: 1.05rem;
            color: #40536a;
        }

        section[aria-labelledby="lab-title"]>h2 {
            font-size: clamp(1.8rem,3vw,2.2rem);
            margin-bottom: 18px;
        }

        :root {
            --paper: #f5f8fa;
            --line: #d6e1e7;
            --shadow: 0 12px 32px rgba(16, 36, 58, 0.08);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 17px;
        }

        main.page-shell {
            flex: 1 0 auto;
            width: min(100%, 1150px);
            margin-block: 38px 56px;
        }

        .page-shell h1 {
            margin: 0 0 14px;
            font-size: clamp(2.15rem, 4vw, 3.2rem);
            text-wrap: balance;
        }

        .page-intro, .page-shell > p:first-of-type {
            max-width: 800px;
            font-size: 1.06rem;
            line-height: 1.75;
        }

        form {
            width: min(100%, 760px);
            padding: clamp(20px, 3vw, 30px);
        }

        fieldset {
            padding: clamp(16px, 2.5vw, 22px);
        }

        label {
            margin: 18px 0 8px;
            line-height: 1.45;
        }

        input:not([type="radio"]):not([type="checkbox"]), select, textarea {
            max-width: 100%;
            min-height: 48px;
            margin-top: 8px;
            border-color: #b9cbd5;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:not([type="radio"]):not([type="checkbox"]):focus, select:focus, textarea:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(23, 107, 120, 0.14);
        }

        button, input[type="submit"] {
            min-height: 46px;
            transition: background-color 160ms ease, color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover, input[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 36, 58, 0.14);
        }

        button:active, input[type="submit"]:active {
            transform: translateY(0);
        }

        section[aria-labelledby] {
            margin-block: 34px;
        }

        @media (max-width: 780px) {
            body {
                font-size: 16px;
            }

            main.page-shell {
                padding-inline: 22px;
                margin-block: 28px 42px;
            }

            form {
                margin-inline: auto;
            }
        }

        @media (max-width: 520px) {
            main.page-shell {
                margin-block: 24px 34px;
            }

            form {
                padding: 18px;
                border-radius: 14px;
            }

            fieldset {
                padding: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        :root {
            --navy: #10243a;
            --ink: #18283b;
            --teal: #176b78;
            --paper: #f6f8f9;
            --line: #d9e2e7;
            --coral: #c94f36;
            --gold: #efbd65;
            --shadow: 0 10px 28px rgba(16, 36, 58, 0.07);
        }

        body {
            color: var(--ink);
            background: var(--paper);
            font-size: 16px;
            line-height: 1.7;
        }

        main.page-shell {
            width: min(100%, 1160px);
            padding-inline: 28px;
            margin: 38px auto 56px;
        }

        h1, h2, h3 {
            color: var(--navy);
            line-height: 1.2;
            letter-spacing: -0.025em;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.1rem);
        }

        h2 {
            margin-top: 0;
            font-size: clamp(1.5rem, 2.6vw, 2rem);
        }

        p {
            max-width: 76ch;
            line-height: 1.75;
        }

         button:focus-visible, a:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        section[aria-labelledby] {
            margin-block: 38px;
        }

        section[aria-labelledby] > h2 {
            margin-bottom: 18px;
        }

         body > footer {
            width: 100%;
            margin-top: auto;
            padding: 30px max(24px, calc((100vw - 1100px) / 2));
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            main.page-shell {
                padding-inline: 22px;
                margin-block: 28px 42px;
            }
        }

        @media (max-width: 520px) {
            body {
                font-size: 16px;
            }

            main.page-shell {
                padding-inline: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }

        @media (max-width: 480px) {
            main.page-shell {
                padding-inline: 18px;
                margin-block: 24px 36px;
            }
        }

        .page-shell {
            scroll-margin-top: 92px;
        }

        :root {
            --content-width: 1100px;
            --page-gutter: clamp(18px, 3vw, 32px);
        }

        main.page-shell {
            width: 100%;
            max-width: var(--content-width);
            margin-inline: auto;
            padding-inline: var(--page-gutter);
            min-width: 0;
        }

        main.page-shell > p, main.page-shell > section > p {
            max-width: none;
        }

        .page-shell > * {
            min-width: 0;
        }
    </style>
    <script>location.replace('hotspot_map.html');</script>
</head>
<body>
<main class="page-shell">
    <h1>Climate profiles have been updated</h1>
    <p class="page-intro">Choose one of the six climate classes on the <a href="hotspot_map.html">Hotspot Map</a>.</p>
</main>
</body>
</html>
