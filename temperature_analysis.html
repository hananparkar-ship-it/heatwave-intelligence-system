        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-inner">
                <button class="nav-toggle" type="button" aria-controls="main-navigation" aria-expanded="false" aria-label="Open navigation" onclick="const n=document.getElementById('main-navigation');const open=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',String(!open));this.setAttribute('aria-label',open?'Open navigation':'Close navigation');n.classList.toggle('is-open',!open);">Menu</button><nav id="main-navigation" class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about_system.html">Heatwave info</a><a href="alert_details.html">

        </header>
        <main class="page-shell">
            <h1>
                Temperature Reading Analysis
            </h1>
            <p>
                Readings: 34, 36, 38, 39, 41, 40, 37, 35, 39, 42. Threshold: 38°C.
            </p>
            <pre id="o">
            </pre>
            <script>
                const readings=[34, 36, 38, 39, 41, 40, 37, 35, 39, 42], threshold=38, min=Math.min(...readings), max=Math.max(...readings), avg=readings.reduce((a, b)=>a+b, 0)/readings.length, above=readings.filter(x=>x>threshold).length, over40=readings.filter(x=>x>=40), high=readings.filter(x=>x>=40);
                document.querySelector('#o').textContent=`Temperature Readings:\n${readings.join(' ')}\n\nMinimum Temperature: ${min}°C\nMaximum Temperature: ${max}°C\nAverage Temperature: ${avg.toFixed(1)}°C\nReadings above ${threshold}°C: ${above}\nReadings ≥ 40°C: ${over40.length}\nHeatwave Condition Readings: ${high.join(', ')}`;
                console.log(readings,  {
                    min, max, avg, above, over40, high
                })
            </script>
        </main>
        <footer class="site-footer">
            <div class="footer-inner">
                Heatwave Intelligence · Community safety through timely information
                <span>
                    <a href="https://mausam.imd.gov.in/">
                        India Meteorological Department
                    </a>
                    ·
                    <a href="tel:1078">
                        Disaster helpline 1078
                    </a>
                </span>
            </div>
        </footer>
        <script>
            const currentPage=location.pathname.split('/').pop()||'index.html';
            document.querySelectorAll('nav a').forEach(link=> {
                if(link.getAttribute('href')===currentPage)link.setAttribute('aria-current', 'page')
            });
        </script>
    </body>
